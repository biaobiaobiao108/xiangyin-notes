<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="象映笔记，一款安静、快速的 Markdown 笔记空间。" />
    <meta name="apple-mobile-web-app-title" content="象映笔记" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=rounded-1" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <base href="/" />
    <title>象映笔记</title>
    <script>
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("xiangying_theme_preference");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch {}
        let systemIsDark = false;
        try { systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch {}
        const resolved = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = resolved === "dark" ? "#1a1b26" : "#f6f4ef";
      })();
    </script>
    <script type="module" src="./entry.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

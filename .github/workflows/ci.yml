name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check Bun application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format --check

      - name: Typecheck
        run: bun run typecheck

      - name: Build application
        run: bun run build

      - name: Test
        run: bun test --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: xiangying-notes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image smoke check
        shell: bash
        run: |
          set -euo pipefail
          container_name=xiangying-notes-ci
          cleanup() { docker rm --force --volumes "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" --publish 127.0.0.1:3030:3030 \
            --health-interval=1s --health-start-period=1s \
            --env XIANGYING_USERNAME=ci \
            --env XIANGYING_PASSWORD=ci-smoke-password \
            --env PORT=3030 \
            xiangying-notes:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3030/api/health >/dev/null; then
              health_status="$(docker inspect --format='{{.State.Health.Status}}' "$container_name")"
              if [[ "$health_status" == healthy ]]; then
                docker exec "$container_name" sh -c 'test -w /data && : > /data/.write-check && rm /data/.write-check'
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

name: Publish Docker image

on:
  push:
    tags:
      - "**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## 象映笔记 $VERSION

          版本号：$VERSION
          镜像地址：$IMAGE:$VERSION
          支持架构：linux/amd64、linux/arm64（同一个 tag 会自动匹配架构）。

          ### 使用此版本镜像

          1. 在项目目录创建 .env 文件，并填入运行时登录凭据：

              XIANGYING_USERNAME=你的用户名
              XIANGYING_PASSWORD=你的密码

          2. 创建持久化数据卷：

              docker volume create xiangying-notes-data

          3. 拉取并启动此版本：

              docker pull $IMAGE:$VERSION
              docker run -d --name xiangying-notes --restart unless-stopped -p 3000:3000 --env-file .env -v xiangying-notes-data:/data $IMAGE:$VERSION

          4. 打开 http://localhost:3000，并使用 .env 中的凭据登录。

          ### 健康检查

              curl http://localhost:3000/api/health

          数据保存在 xiangying-notes-data volume 中。升级或回滚时只需更换镜像 tag，并继续使用同一个数据卷。
          EOF

          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" --notes-file release-notes.md

name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ "$VERSION" != v* || ! "$version" =~ $semver_regex ]]; then
            echo "Release tag must be a valid v-prefixed SemVer version: $VERSION" >&2
            exit 1
          fi

  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish image
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## 象映笔记 $VERSION

          版本号：$VERSION
          镜像地址：$IMAGE:$VERSION
          支持架构：linux/amd64、linux/arm64（同一个 tag 会自动匹配架构）。

          ### 使用此版本镜像

          1. 在项目目录创建 .env 文件，并填入运行时登录凭据：

              XIANGYING_USERNAME=你的用户名
              XIANGYING_PASSWORD=你的密码
              # 使用快捷指令导入时再配置
              XIANGYING_API_TOKEN=随机生成的 API Token

          2. 创建持久化数据卷：

              docker volume create xiangying-notes-data

          3. 首次安装时拉取并启动此版本：

              docker pull $IMAGE:$VERSION
              docker run -d --name xiangying-notes --restart unless-stopped -p 3000:3000 --env-file .env -v xiangying-notes-data:/data $IMAGE:$VERSION

          首次启动的空数据库会自动初始化。升级已有安装时，使用同一个数据卷启动新镜像，服务会在监听请求前自动执行已知的事务迁移并校验 schema。遇到未知版本或结构漂移时会停止启动，保留原数据卷供排查：

              docker pull $IMAGE:$VERSION
              docker stop xiangying-notes
              docker rm xiangying-notes
              # 可选：在启动新容器前，使用新镜像检查并迁移同一个数据卷
              docker run --rm --env DATABASE_PATH=/data/xiangying-notes.sqlite -v xiangying-notes-data:/data $IMAGE:$VERSION bun dist/server/migrate.js
              docker run -d --name xiangying-notes --restart unless-stopped -p 3000:3000 --env-file .env -v xiangying-notes-data:/data $IMAGE:$VERSION

          服务启动时会自动执行迁移；如需单独预先迁移，可在停止并移除旧容器后运行上面的可选命令。升级或回滚时继续使用同一个数据卷；回滚前应确认目标旧版本兼容当前数据库 schema。

          4. 打开 http://127.0.0.1:3000/app，并使用 .env 中的凭据登录。

          ### 健康检查

              curl http://localhost:3000/api/health

          数据保存在 xiangying-notes-data volume 中。
          EOF

          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" --notes-file release-notes.md
